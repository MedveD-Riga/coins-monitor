name: Monitor coins

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # каждые 15 минут (не в начале часа, чтобы реже задерживалось)
  workflow_dispatch:                # позволяет запустить вручную кнопкой

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests beautifulsoup4

      - name: Check the site
        run: python monitor.py once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}

      - name: Save state
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "update state" && git push)
